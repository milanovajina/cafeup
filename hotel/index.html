<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A2D">
<title>Hotel Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@600&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#1E2A2D;--sand:#F5F0E6;--sand2:#EBE3D3;--card:#FFFDF8;--teal:#2C6B66;--teal-soft:#E1ECEA;--saffron:#E3A23A;--muted:#5E6B6D;--line:#DCD2C0;--red:#B23A48}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.45 "Be Vietnam Pro",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
:lang(ru) body{font-family:"Manrope",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:var(--sand);padding:18px 0 22px;border-radius:0 0 24px 24px}
.top{display:flex;align-items:center;gap:12px}
.brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--saffron)}
h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:26px;line-height:1.15;margin:4px 0 2px}
.sub{color:#B9C5C3;font-size:14px}
.lang{margin-left:auto;display:flex;background:rgba(245,240,230,.12);border-radius:999px;padding:3px;align-self:flex-start}
.lang button{border:0;background:none;color:#C9D3D1;font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.roomchip{display:inline-block;margin-top:12px;background:var(--saffron);color:var(--ink);font-weight:800;border-radius:999px;padding:6px 14px;font-size:15px}
.notice{margin:14px 0 0;background:var(--teal-soft);border-radius:14px;padding:12px 14px;font-size:15px;white-space:pre-line}
.banner{margin:16px 0 0;background:#FBE9D2;border:1px solid #EBC99A;border-radius:14px;padding:12px 14px;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--teal);color:var(--sand);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:16px;line-height:1.2}
.tile small{color:var(--muted);font-size:13px;line-height:1.3}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0}
.tile:disabled{opacity:.45}
.badge{background:var(--saffron);color:var(--ink);border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px;margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{display:flex;gap:10px;padding:0}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--teal);color:#fff;flex:1;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--sand2);color:var(--ink)}
.btn.warn{background:var(--red)}
.btn:disabled{opacity:.45}
/* panels */
.panel{position:fixed;inset:0;background:var(--sand);z-index:10;overflow:auto;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.phead{position:sticky;top:0;background:var(--sand);padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.phead .wrap{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--sand2);border-radius:12px;width:40px;height:40px;font-size:22px;line-height:1}
.phead h2{margin:0;font-family:"Lora",Georgia,serif;font-weight:600;font-size:22px}
.pfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:3}
.pfoot .wrap{padding:0;display:flex;gap:10px;align-items:center}
.lbl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip:disabled{opacity:.4;text-decoration:line-through}
textarea,input[type=text],input[type=date],input[type=time],input[type=tel]{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px}
textarea{min-height:96px;resize:vertical}
.cats{display:flex;gap:8px;overflow:auto;padding:10px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin:10px 0}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item .o{color:var(--muted);font-size:13px}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sand)}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--teal);font-size:20px;font-weight:700;line-height:1}
.step span{min-width:26px;text-align:center;font-weight:800}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:22px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.req{display:flex;gap:12px;align-items:flex-start}
.req .t{flex:1}
.req b{display:block}
.req small{color:var(--muted)}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.new{background:var(--sand2)}.st.accepted{background:#FBE9D2}.st.working{background:#FBE9D2}.st.done{background:var(--teal-soft);color:var(--teal)}.st.rejected{background:#F6DCDF;color:var(--red)}
.prog{display:flex;gap:4px;margin-top:8px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--teal)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0 0}
.info h3{margin:0 0 4px;font-size:16px}
.rule{display:flex;gap:12px;align-items:center;margin:8px 0}
.rule .ri{font-size:26px;line-height:1;width:36px;text-align:center;flex:none}
.info p{margin:0;color:var(--muted)}
.copy{border:0;background:var(--teal-soft);color:var(--teal);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(30,42,45,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--sand);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.mbox h3{margin:0 0 6px;font-family:"Lora",Georgia,serif;font-size:22px}
.codein{letter-spacing:.5em;text-align:center;font-size:28px!important;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:12px 18px;border-radius:14px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
.thanks{text-align:center;padding:40px 0}
.thanks h2{font-family:"Lora",Georgia,serif;font-size:28px;margin:0 0 8px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.svc{display:flex;gap:12px;align-items:center}
.svc .t{flex:1}
.trn{display:block;color:var(--teal);font-size:13px;margin-top:4px}
footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0 8px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><div class="brand">Hotel Up</div><h1 id="hName">…</h1><div class="sub" id="hSub"></div></div>
  <div class="lang" role="group" aria-label="Language"><button data-l="vi">VI</button><button data-l="en">EN</button><button data-l="ru">RU</button></div></div>
  <span class="roomchip" id="roomChip"></span>
</div></header>
<main class="wrap">
  <div class="notice" id="notice" hidden></div>
  <div class="banner" id="notIn" hidden></div>
  <div class="banner" id="offline" hidden></div>
  <div class="tiles" id="tiles"></div>
  <footer>Hotel Up · <span id="ver"></span></footer>
</main>
<div class="bar"><div class="wrap"><a class="btn ghost" id="callBtn" href="#"></a><button class="btn" id="msgBtn"></button></div></div>

<section class="panel" id="panel" hidden>
  <div class="phead"><div class="wrap"><button class="back" id="back" aria-label="Back">‹</button><h2 id="pTitle"></h2></div></div>
  <div class="wrap" id="pBody"></div>
  <div class="pfoot" id="pFoot" hidden><div class="wrap" id="pFootIn"></div></div>
</section>

<div class="modal" id="codeModal" hidden><div class="mbox">
  <h3 id="cmT"></h3><p class="hint" id="cmP"></p>
  <input type="tel" inputmode="numeric" maxlength="4" class="codein" id="codeIn" autocomplete="one-time-code">
  <div class="err" id="codeErr"></div>
  <div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" id="cmCancel"></button><button class="btn" id="cmOk"></button></div>
</div></div>
<div class="toast" id="toast" hidden></div>

  B.innerHTML = `<div class="lbl">${t('what')}</div>${chips('what', items, sel.what)}<div class="lbl">${t('note')}</div><textarea id="kText" maxlength="300" placeholder="${esc(t('brokenPh'))}">${esc(sel.kText || '')}</textarea><p class="hint">${t('bringH')}</p>`;
  foot(sendBtn()); $('go').disabled = !sel.what;
  B.onclick = e => { const ch = e.target.closest('[data-chips] .chip'); if (ch) { sel.kText = $('kText').value; sel.what = ch.dataset.c; VIEWS.broken(B) } };
  const VI = { ac: 'Máy lạnh', water: 'Nước', power: 'Điện, đèn', tv: 'TV', wifi: 'Wi-Fi', lock: 'Khóa cửa', other: 'Khác' };
  $('go').onclick = () => submit('broken', { what: VI[sel.what], text: $('kText').value });
 },
 services(B) {
  if (!sel.svc) {
   B.innerHTML = CFG.services.map(s => `<button class="card svc" data-s="${s.id}" style="width:100%;text-align:left"><span class="t"><b>${esc(L(s))}</b>${lang !== 'vi' ? `<span class="hint" style="display:block">${esc(s.vi)}</span>` : ''}</span><span class="price">${fmt(s.price)}${t('per_' + (s.per || 'once'))}</span></button>`).join('') + `<p class="hint">${t('svcH')}</p>`;
   B.onclick = e => { const b = e.target.closest('[data-s]'); if (b) { sel.svc = b.dataset.s; VIEWS.services(B) } };
   return;
  }
  const s = CFG.services.find(x => x.id === sel.svc), ask = s.ask || [];
  const f = { date: `<div class="lbl">${t('date')}</div><input type="date" id="sDate" value="${esc(sel.sDate || days()[1][0])}" min="${days()[0][0]}">`, time: `<div class="lbl">${t('time')}</div><input type="time" id="sTime" value="${esc(sel.sTime || '')}">`,
   people: `<div class="lbl">${t('people')}</div><span class="step"><button data-n="people" data-d="-1">−</button><span>${sel.people || 1}</span><button data-n="people" data-d="1">+</button></span>`,
   days: `<div class="lbl">${t('days')}</div><span class="step"><button data-n="days" data-d="-1">−</button><span>${sel.days || 1}</span><button data-n="days" data-d="1">+</button></span>`,
   flight: `<div class="lbl">${t('flight')}</div><input type="text" id="sFlight" maxlength="20" value="${esc(sel.sFlight || '')}">` };
  const mult = s.per === 'person' ? (sel.people || 1) : s.per === 'day' ? (sel.days || 1) : 1, pay = sel.pay || (CFG.protect === 'code' ? 'room' : 'delivery');
  B.innerHTML = `<div class="card"><b>${esc(L(s))}</b><br><span class="price">${fmt(s.price)}${t('per_' + (s.per || 'once'))}</span></div>` + ask.map(k => f[k] || '').join('') +
   `<div class="lbl">${t('pay')}</div>${chips('pay', CFG.protect === 'code' ? [['room', t('payRoom')], ['delivery', t('payDel')]] : [['delivery', t('payDel')]], pay)}<div class="lbl">${t('note')}</div><input type="text" id="sNote" maxlength="200" value="${esc(sel.sNote || '')}"><p class="hint">${t('svcH')}</p>`;
  foot(`<div style="flex:1"><b>${fmt(s.price * mult)}</b></div>${sendBtn()}`);
  const keep = () => { ['sDate', 'sTime', 'sFlight', 'sNote'].forEach(k => { if ($(k)) sel[k] = $(k).value }) };
  B.onclick = e => { const n = e.target.closest('[data-n]'); if (n) { keep(); sel[n.dataset.n] = Math.max(1, Math.min(30, (sel[n.dataset.n] || 1) + +n.dataset.d)); VIEWS.services(B); return }
   const ch = e.target.closest('[data-chips] .chip'); if (ch) { keep(); sel.pay = ch.dataset.c; VIEWS.services(B) } };
  $('go').onclick = () => { keep(); const p = sel.pay || pay; needCode(p, () => submit('service', { id: s.id, date: ask.includes('date') ? sel.sDate || days()[1][0] : '', time: sel.sTime || '', people: ask.includes('people') ? sel.people || 1 : '', days: ask.includes('days') ? sel.days || 1 : '', flight: sel.sFlight || '', text: sel.sNote || '' }, { pay: p, code })) };
 },
 info(B) {
  const RI = { smoke: '🚭', cards: '🃏', money: '💵', quiet: '🤫', bike: '🛵', laundry: '👕', bin: '🗑️' };
  const floor = /^\d{3,4}$/.test(ROOM) ? ROOM.slice(0, -2) : '';
  const wifiTxt = i => i.floorNet && floor ? `${t('yourNet')}: <b>${esc(i.floorNet + floor)}</b><br>${t('password')}: <b>${esc(i.copy || '')}</b>` : esc(L(i.d));
  B.innerHTML = CFG.info.map(i => `<div class="card info"><h3>${esc(L(i.t))}</h3><p>${wifiTxt(i)}</p>${i.copy ? `<button class="copy" data-copy="${esc(i.copy)}">${t('copy')}: ${esc(i.copy)}</button>` : ''}</div>`).join('') +
   ((CFG.rules || []).length ? `<div class="lbl">${t('rulesH')}</div>` + CFG.rules.map(r => `<div class="card rule"><span class="ri">${RI[r.icon] || '•'}</span><span>${esc(L(r))}</span></div>`).join('') + `<p class="hint" style="text-align:center">${t('thanksRules')}</p>` : '') +
   ((CFG.damages || []).length ? `<div class="lbl">${t('damH')}</div><p class="hint">${t('damP')}</p><div class="card">${CFG.damages.map(d => `<div class="row"><span>${esc(L(d))}${lang !== 'vi' ? `<br><small class="hint">${esc(d.vi)}</small>` : ''}</span><span class="price">$${d.usd}${d.pc ? t('pc') : ''}</span></div>`).join('')}</div>` : '');
  B.onclick = e => { const c = e.target.closest('[data-copy]'); if (c) { try { navigator.clipboard.writeText(c.dataset.copy).then(() => toast(t('copied'))) } catch (er) {} } };
 },
 call(B) {
  B.innerHTML = `<div class="lbl">${t('msg')}</div><textarea id="mText" maxlength="300" placeholder="${esc(t('msgPh'))}"></textarea><p class="hint">${t('bringH')}</p>`;
  foot(sendBtn());
  $('go').onclick = () => { const v = $('mText').value.trim(); if (!v) { $('mText').focus(); return } submit('call', { text: v }) };
 },
 my(B) { renderMy(B) },
 async bill(B) {
  if (CFG.protect === 'code' && !code) { B.innerHTML = ''; askCode(() => VIEWS.bill(B)); return }
  B.innerHTML = '<p class="hint">…</p>';
  try {
   const d = await api('/bill?code=' + encodeURIComponent(code)), sum = d.lines.reduce((s, l) => s + l.amount, 0);
   B.innerHTML = `<div class="card">${d.lines.length ? d.lines.map(l => `<div class="row"><span>${esc(l.title)}<br><small class="hint">${new Date(l.created).toLocaleDateString()}</small></span><span class="price">${fmt(l.amount)}</span></div>`).join('') + `<div class="total"><span>${t('total')}</span><span>${fmt(sum)}</span></div>` : `<p class="hint">${t('billEmpty')}</p>`}</div><p class="hint">${t('checkoutH')}</p>`;
   foot(`<button class="btn" id="go">${t('checkout')}</button>`);
   $('go').onclick = () => submit('checkout', { text: '' });
  } catch (e) { if (e.status === 403) { ls.del('code'); code = ''; askCode(() => VIEWS.bill(B)) } else B.innerHTML = `<p class="banner">${t('offline')}</p>` }
 },
};

/* ---------- my requests with live status ---------- */
let MY = [];
const TITLE = r => r.type === 'service' ? L((CFG.services.find(s => s.id === r.data.id) || {})) || t('services') : r.type === 'call' ? t('msg') : r.type === 'checkout' ? t('checkout') : t(r.type);
function detail(r) {
  const d = r.data || {};
  if (r.type === 'food') return (d.items || []).map(i => `${i.q}× ${L(CFG.menu.find(m => m.id === i.id))}`).join(', ');
  if (r.type === 'clean') return d.skip ? t('skip') : `${d.date === days()[0][0] ? t('today') : d.date === days()[1][0] ? t('tomorrow') : d.date} · ${d.slot}`;
  if (r.type === 'laundry') return `${d.express ? t('express') : t('normal')} · ${d.slot}`;
  if (r.type === 'wake') return `${d.date === days()[0][0] ? t('today') : d.date === days()[1][0] ? t('tomorrow') : d.date} · ${d.time}`;
  const day = d.date === days()[0][0] ? t('today') : d.date === days()[1][0] ? t('tomorrow') : (d.date ? new Date(d.date + 'T00:00').toLocaleDateString(lang) : '');
  return [d.what, day, d.time, d.people ? d.people + ' ' + t('people').toLowerCase() : '', d.text].filter(Boolean).join(' · ');
}
function renderMy(B) {
  B = B || (view === 'my' && $('pBody')); if (!B) return;
  if (!myIds.length) { B.innerHTML = `<p class="hint" style="margin-top:20px">${t('noReq')}</p>`; return }
  const order = ['new', 'accepted', 'working', 'done'];
  B.innerHTML = MY.slice().sort((a, b) => b.id - a.id).map(r => {
    const i = order.indexOf(r.status), note = r.note ? (tr(r.note, () => renderMy()) || r.note) : '';
    return `<div class="card req"><div class="t"><b>${esc(TITLE(r))}</b><small>${esc(detail(r))}</small>${r.amount ? `<br><small>${fmt(r.amount)}</small>` : ''}${note ? `<span class="trn">💬 ${esc(note)}</span>` : ''}
      ${r.status !== 'rejected' ? `<div class="prog">${order.map((s, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>
      <span class="st ${r.status}">${t('st' + r.status[0].toUpperCase() + r.status.slice(1))}</span></div>`;
  }).join('') + `<p class="hint">${t('cancelInfo')}</p>`;
}
let pollT;
async function pollMy() {
  clearTimeout(pollT);
  if (myIds.length) { try { const d = await api('/my?ids=' + myIds.join(',')); const before = JSON.stringify(MY.map(r => r.status)); MY = d.items; if (JSON.stringify(MY.map(r => r.status)) !== before) renderMy(); $('offline').hidden = true } catch (e) {} }
  pollT = setTimeout(pollMy, document.hidden ? 30000 : 6000);
}

/* ---------- start ---------- */
async function loadCfg() {
  const d = await api('/cfg'); CFG = d.cfg; taken = d.taken || {};
  if (d.occupied && !ls.get('lang') && d.lang && T[d.lang]) lang = d.lang;
  // the stay ended since the last visit → thank-you screen and a fresh start for the next guest
  if (wasIn && !d.occupied && CFG.protect === 'code') { showThanks(); ['ids', 'code', 'wasIn'].forEach(ls.del); myIds = []; code = ''; wasIn = false }
  occupied = d.occupied; if (occupied) { ls.set('wasIn', '1'); wasIn = true }
}
function showThanks() {
  view = 'thanks'; $('panel').hidden = false; $('pTitle').textContent = CFG.name; foot('');
  $('pBody').innerHTML = `<div class="thanks"><h2>${t('thanks')}</h2><p class="hint">${t('thanksP')}</p>${CFG.review ? `<a class="btn" style="margin-top:20px" href="${esc(CFG.review)}" target="_blank" rel="noopener">${t('rate')}</a>` : ''}</div>`;
}
(async () => {
  $('ver').textContent = HOTEL;
  if (!ROOM) { $('hName').textContent = 'Hotel Up'; $('tiles').innerHTML = '<p class="banner">Scan the QR code in your room.</p>'; return }
  applyLang();
  try { await loadCfg(); $('offline').hidden = true } catch (e) { $('offline').hidden = !(!e.status || e.status >= 500); if (e.status === 404) $('tiles').innerHTML = '<p class="banner">Unknown room.</p>' }
  applyLang(); pollMy();
  setInterval(async () => { if (!view) { try { const was = occupied; await loadCfg(); if (was !== occupied) applyLang() } catch (e) {} } }, 60000);
})();
})();
</script>
</body>
</html>
