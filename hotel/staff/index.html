<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A2D">
<title>Hotel Up · Nhân viên</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#1E2A2D;--sand:#F5F0E6;--sand2:#EBE3D3;--card:#FFFDF8;--teal:#2C6B66;--teal-soft:#E1ECEA;--saffron:#E3A23A;--amber-soft:#FBE9D2;--muted:#5E6B6D;--line:#DCD2C0;--red:#B23A48;--red-soft:#F6DCDF;--blue:#3A5BA0;--blue-soft:#E2E8F4}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
:lang(ru) body{font-family:"Manrope",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:var(--sand);position:sticky;top:0;z-index:5}
.hb{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.06em}
.brand small{display:block;font-weight:500;letter-spacing:0;color:#B9C5C3;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#7a8;display:inline-block;margin-right:6px}
.dot.off{background:var(--red)}
.st{font-size:13px;color:#C9D3D1}
.sp{flex:1}
.hbtn{border:0;background:rgba(245,240,230,.12);color:var(--sand);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.hbtn[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.tabs{display:flex;gap:6px;padding:0 0 10px}
.tab{border:0;background:none;color:#C9D3D1;padding:8px 14px;border-radius:10px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.tab .n{background:var(--saffron);color:var(--ink);border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:40px}
.rq{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rq.d-kitchen{border-left-color:var(--saffron)}.rq.d-house{border-left-color:var(--teal)}.rq.d-desk{border-left-color:var(--blue)}
.rq.late{box-shadow:0 0 0 2px var(--red)}
.rq.fresh{animation:fl 1s ease 3}
@keyframes fl{50%{background:var(--amber-soft)}}
.rh{display:flex;align-items:center;gap:10px}
.room{font-size:26px;font-weight:800;line-height:1}
.ty{font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.ago{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.late .ago{color:var(--red);font-weight:700}
.det{font-size:16px}
.note{background:var(--sand);border-radius:10px;padding:8px 10px;font-size:15px}
.note .trn{display:block;color:var(--teal);font-size:14px;margin-top:4px}
.meta{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.b{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--sand2)}
.b.p{background:var(--teal);color:#fff}
.b.r{background:var(--red-soft);color:var(--red)}
.b.s{background:var(--amber-soft)}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px}
.badge.new{background:var(--amber-soft)}.badge.accepted,.badge.working{background:var(--blue-soft);color:var(--blue)}.badge.done{background:var(--teal-soft);color:var(--teal)}.badge.rejected{background:var(--red-soft);color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0 40px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px}
.rc .rn{font-size:24px;font-weight:800}
.rc.occ{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.rc .s{font-size:13px;font-weight:700;color:var(--muted)}
.rc.occ .s{color:var(--teal)}
.rc .g{font-size:14px}
.rc .sum{margin-top:auto;font-weight:700}
.rc .open{font-size:12px;background:var(--amber-soft);border-radius:999px;padding:2px 8px;align-self:flex-start}
.modal{position:fixed;inset:0;background:rgba(30,42,45,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--sand);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px;padding:18px}
.mbox h3{margin:0 0 10px;font-size:20px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{min-height:70px}
.mact{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.bigcode{font-size:56px;font-weight:800;letter-spacing:.2em;text-align:center;background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.line{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .t{flex:1}
.line .a{font-weight:700;white-space:nowrap}
.x{border:0;background:var(--red-soft);color:var(--red);border-radius:8px;width:30px;height:30px;font-weight:800}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:10px}
.sub{display:flex;justify-content:space-between;color:var(--muted);padding-top:6px}
.grid3{display:grid;grid-template-columns:2fr 1fr 70px auto;gap:6px;align-items:center}
.set{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.set h3{margin:0 0 6px;font-size:17px}
.erow{display:grid;gap:6px;grid-template-columns:repeat(var(--c),minmax(0,1fr)) 36px;align-items:center;margin:6px 0}
.erow input,.erow select{padding:8px}
.login{max-width:380px;margin:12vh auto;background:var(--card);border-radius:18px;padding:24px;border:1px solid var(--line)}
.login h1{margin:0 0 4px;font-size:24px}
.err{color:var(--red);min-height:1.2em;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30}
.hint{color:var(--muted);font-size:13px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{size:80mm auto;margin:3mm}}
.rcpt{width:74mm;font:13px/1.35 system-ui,sans-serif;color:#000}
.rcpt h2{text-align:center;margin:0;font-size:17px}
.rcpt .c{text-align:center}
.rcpt .r{display:flex;justify-content:space-between;gap:6px}
.rcpt hr{border:0;border-top:1px dashed #000}
.rcpt .big{font-weight:800;font-size:16px}
.rcpt svg{width:44mm;height:44mm}
</style>
</head>
<body>
<div id="loginBox" class="login" hidden>
  <div class="brand" style="color:var(--teal)">HOTEL UP</div>
  <h1 data-t="loginH"></h1><p class="hint" data-t="loginP"></p>
  <input type="password" id="code" inputmode="numeric" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button class="b p" id="loginBtn" style="width:100%;margin-top:6px" data-t="loginBtn"></button>
  <div class="bar" style="justify-content:center"><button class="chip" data-l="vi">VI</button><button class="chip" data-l="en">EN</button><button class="chip" data-l="ru">RU</button></div>
</div>

<div id="app" hidden>
<header><div class="wrap">
  <div class="hb">
    <div class="brand">HOTEL UP <small id="hName"></small></div>
    <span class="st"><span class="dot" id="dot"></span><span id="stText"></span></span>
    <span class="sp"></span>
    <button class="hbtn" id="soundBtn"></button>
    <button class="hbtn" id="pushBtn"></button>
    <span class="hb" style="padding:0;gap:4px"><button class="hbtn" data-l="vi">VI</button><button class="hbtn" data-l="en">EN</button><button class="hbtn" data-l="ru">RU</button></span>
    <button class="hbtn" id="logoutBtn" data-t="logout"></button>
  </div>
  <div class="tabs"><button class="tab" data-tab="feed"></button><button class="tab" data-tab="rooms"></button><button class="tab" data-tab="settings"></button></div>
</div></header>
<main class="wrap">
  <section id="feedTab">
    <div class="bar" id="deptBar"></div>
    <div class="bar" id="stBar"></div>
    <div class="feed" id="feed"></div>
  </section>
  <section id="roomsTab" hidden><div class="rooms" id="rooms"></div></section>
  <section id="settingsTab" hidden></section>
</main>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script src="qr.js"></script>

        if (e.target.closest('#aBtn')) { const tt = $('aT').value.trim(), a = +$('aA').value; if (!tt || !a) return; try { await api('/staff/charge', { stay: BILL.stay.id, title: tt, amount: a, qty: +$('aQ').value || 1 }); openBill(BILL.stay); poll() } catch (er) { toast(er.message) } return }

        if (e.target.closest('#bOut')) { if (!confirm(t('confirmOut'))) return; try { await api('/staff/checkout', { stay: BILL.stay.id, pay: billOpt.pay, total: calc().total }); closeModal(); poll() } catch (er) { toast(er.message) } }
      };
    });
  function redrawTotals() { const keep = [document.activeElement && document.activeElement.id]; drawBill(); if (keep[0] && $(keep[0])) { const el = $(keep[0]); el.focus(); const v = el.value; el.value = ''; el.value = v } }
}
function printBill() {
  const s = BILL.stay, c = calc(), vq = CFG.vietqr || {};
  const qr = billOpt.pay === 'qr' && vq.bin && vq.account && typeof vqSvg === 'function' ? `<hr><div class="c">${vqSvg(vq, c.total, 'Phong ' + s.room)}<div>VietQR · ${money(c.total)}<br>${esc(vq.bank || '')}<br>${t('scan')}</div></div>` : '';
  $('printArea').innerHTML = `<div class="rcpt"><h2>${esc(CFG.name)}</h2><div class="c">${esc(L(CFG.sub))}${CFG.phone ? '<br>' + esc(CFG.phone) : ''}</div><hr>
    <div class="r"><b>${t('room')} ${esc(s.room)}</b><span>${new Date().toLocaleString('vi', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></div>${s.guest ? `<div>${esc(s.guest)}</div>` : ''}<hr>
    ${BILL.lines.map(l => `<div class="r"><span>${esc(l.title)}</span><span>${money(l.amount)}</span></div>`).join('')}<hr>
    <div class="r"><span>Tạm tính</span><span>${money(c.sub)}</span></div>${c.disc ? `<div class="r"><span>Giảm giá (${billOpt.disc}%)</span><span>−${money(c.disc)}</span></div>` : ''}${c.tax ? `<div class="r"><span>Thuế (${billOpt.tax}%)</span><span>+${money(c.tax)}</span></div>` : ''}
    <div class="r big"><span>Tổng</span><span>${money(c.total)}</span></div><div>Thanh toán: ${({ cash: 'Tiền mặt', qr: 'Chuyển khoản VietQR', card: 'Thẻ ngân hàng' })[billOpt.pay]}</div>${qr}
    <hr><div class="c" style="font-size:11px">Phiếu tạm tính — không phải hóa đơn GTGT${lang !== 'vi' ? '<br>' + t('provisional') : ''}<br><b>Cảm ơn quý khách!${lang !== 'vi' ? ' · ' + t('thanks') : ''}</b></div></div>`;
  setTimeout(() => window.print(), 50);
}

/* ---------- settings (owner) ---------- */
function renderSettings() {
  const C = JSON.parse(JSON.stringify(CFG)); const S = $('settingsTab'); S.dataset.built = '1';
  const tri = (key, obj) => ['vi', 'en', 'ru'].map(l => `<input type="text" data-tri="${key}" data-l3="${l}" placeholder="${t(l + 'Ph')}" value="${esc((obj || {})[l] || '')}">`).join('');
  const guest = location.href.replace(/staff\/.*$/, '') + (HOTEL !== 'demo' ? '?h=' + HOTEL : '') + '#room-' + (CFG.rooms[0] || '101');
  S.innerHTML = `
  <div class="set"><h3>${t('sHotel')}</h3>
    <div class="lbl">${t('name')}</div><input type="text" id="sName" value="${esc(C.name)}">
    <div class="lbl">${t('phone')}</div><input type="text" id="sPhone" value="${esc(C.phone || '')}">
    <div class="lbl">${t('review')}</div><input type="text" id="sReview" value="${esc(C.review || '')}">
    <div class="lbl">${t('notice')}</div><div style="display:grid;gap:6px">${tri('notice', C.notice)}</div><p class="hint">${t('autoTr')}</p>
    <div class="lbl">${t('protect')}</div><select id="sProtect"><option value="code" ${C.protect === 'code' ? 'selected' : ''}>${t('pCode')}</option><option value="delivery" ${C.protect !== 'code' ? 'selected' : ''}>${t('pDel')}</option></select>
    <div class="lbl">${t('sRooms')}</div><input type="text" id="sRooms" value="${esc(C.rooms.join(', '))}">
    <p class="hint">${t('guestLink')}: <a href="${esc(guest)}" target="_blank">${esc(guest)}</a></p>
    <button class="b" id="qrBtn">${t('printQr')}</button></div>
  <div class="set"><h3>${t('clean')} · ${t('laundry')}</h3>
    <div class="lbl">${t('sSlots')}</div><input type="text" id="sSlots" value="${esc(C.slots.join(', '))}">
    <div style="display:flex;gap:8px"><label style="flex:1"><span class="lbl" style="display:block">${t('slotCap')}</span><input type="number" id="sCap" value="${C.slotCap}"></label><label style="flex:1"><span class="lbl" style="display:block">${t('perKg')}</span><input type="number" id="sKg" value="${C.laundry.perKg}"></label><label style="flex:1"><span class="lbl" style="display:block">${t('expressPct')}</span><input type="number" id="sExp" value="${C.laundry.express}"></label></div></div>
  <div class="set"><h3>${t('sMenu')}</h3><div style="display:flex;gap:8px"><label style="flex:1"><span class="lbl" style="display:block">${t('kitchen')}</span><input type="time" id="sKf" value="${C.kitchen.from}"></label><label style="flex:1"><span class="lbl" style="display:block">&nbsp;</span><input type="time" id="sKt" value="${C.kitchen.to}"></label></div>
    <div id="menuRows"></div><button class="b" id="addMenu">${t('addRow')}</button></div>
  <div class="set"><h3>${t('sSvc')}</h3><div id="svcRows"></div><button class="b" id="addSvc">${t('addRow')}</button></div>
  <div class="set"><h3>${t('sInfo')}</h3><div id="infoRows"></div><button class="b" id="addInfo">${t('addRow')}</button></div>
  <div class="set"><h3>${t('vqTitle')}</h3><div style="display:flex;gap:8px"><input type="text" id="vqBank" placeholder="${t('vqBank')}" value="${esc((C.vietqr || {}).bank || '')}"><input type="text" id="vqBin" placeholder="${t('vqBin')}" value="${esc((C.vietqr || {}).bin || '')}"><input type="text" id="vqAcc" placeholder="${t('vqAcc')}" value="${esc((C.vietqr || {}).account || '')}"></div></div>
  <div style="position:sticky;bottom:0;background:var(--sand);padding:12px 0 20px"><button class="b p" id="saveCfg" style="width:100%;padding:14px">${t('saveAll')}</button></div>`;
  const catOpts = v => C.cats.map(c => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c[lang] || c.vi)}</option>`).join('');
  const menuRow = m => `<div class="erow" style="--c:5" data-mid="${esc(m.id)}"><input type="text" data-f="vi" value="${esc(m.vi)}" placeholder="${t('viPh')}"><input type="text" data-f="en" value="${esc(m.en || '')}" placeholder="${t('enPh')}"><input type="text" data-f="ru" value="${esc(m.ru || '')}" placeholder="${t('ruPh')}"><input type="number" data-f="price" value="${m.price}" placeholder="${t('price')}"><select data-f="cat">${catOpts(m.cat)}</select><button class="x" data-rm>×</button></div>`;
  const svcRow = s => `<div class="erow" style="--c:5" data-sid="${esc(s.id)}" data-ask="${esc((s.ask || ['date', 'time']).join(','))}"><input type="text" data-f="vi" value="${esc(s.vi)}"><input type="text" data-f="en" value="${esc(s.en || '')}"><input type="text" data-f="ru" value="${esc(s.ru || '')}"><input type="number" data-f="price" value="${s.price}"><select data-f="per">${['once', 'day', 'person'].map(p => `<option value="${p}" ${s.per === p ? 'selected' : ''}>${t('per' + p[0].toUpperCase() + p.slice(1))}</option>`).join('')}</select><button class="x" data-rm>×</button></div>`;
  const infoRow = i => `<div class="set" style="margin:8px 0;padding:10px" data-info="1" data-copy="${esc(i.copy || '')}"><div class="erow" style="--c:3">${['vi', 'en', 'ru'].map(l => `<input type="text" data-it="${l}" placeholder="${t('infoT')} · ${t(l + 'Ph')}" value="${esc((i.t || {})[l] || '')}">`).join('')}<button class="x" data-rm>×</button></div><div class="erow" style="--c:3">${['vi', 'en', 'ru'].map(l => `<textarea data-id="${l}" placeholder="${t('infoD')} · ${t(l + 'Ph')}">${esc((i.d || {})[l] || '')}</textarea>`).join('')}<span></span></div></div>`;
  $('menuRows').innerHTML = C.menu.map(menuRow).join(''); $('svcRows').innerHTML = C.services.map(svcRow).join(''); $('infoRows').innerHTML = C.info.map(infoRow).join('');
  S.onclick = async e => {
    const rm = e.target.closest('[data-rm]'); if (rm) { (rm.closest('[data-info]') || rm.closest('.erow')).remove(); return }
    if (e.target.closest('#addMenu')) { $('menuRows').insertAdjacentHTML('beforeend', menuRow({ id: 'm' + Date.now().toString(36), vi: '', price: 0, cat: C.cats[0].id })); return }
    if (e.target.closest('#addSvc')) { $('svcRows').insertAdjacentHTML('beforeend', svcRow({ id: 's' + Date.now().toString(36), vi: '', price: 0, per: 'once', ask: ['date', 'time'] })); return }
    if (e.target.closest('#addInfo')) { $('infoRows').insertAdjacentHTML('beforeend', infoRow({})); return }
    if (e.target.closest('#qrBtn')) { printQr(); return }
    if (e.target.closest('#saveCfg')) saveCfg();
  };
  async function saveCfg() {
    const n = Object.assign({}, CFG);
    n.name = $('sName').value.trim() || CFG.name; n.phone = $('sPhone').value.trim(); n.review = $('sReview').value.trim(); n.protect = $('sProtect').value;
    n.notice = {}; S.querySelectorAll('[data-tri="notice"]').forEach(i => n.notice[i.dataset.l3] = i.value.trim());
    n.rooms = $('sRooms').value.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
    n.slots = $('sSlots').value.split(',').map(s => s.trim()).filter(Boolean); n.slotCap = +$('sCap').value || 4;
    n.laundry = Object.assign({}, CFG.laundry, { perKg: +$('sKg').value || 0, express: +$('sExp').value || 0 }); n.kitchen = { from: $('sKf').value, to: $('sKt').value };
    n.menu = [...$('menuRows').children].map(r => { const g = f => r.querySelector(`[data-f="${f}"]`).value.trim(); return { id: r.dataset.mid, vi: g('vi'), en: g('en'), ru: g('ru'), price: +g('price') || 0, cat: g('cat') } }).filter(m => m.vi);
    n.services = [...$('svcRows').children].map(r => { const g = f => r.querySelector(`[data-f="${f}"]`).value.trim(); return { id: r.dataset.sid, vi: g('vi'), en: g('en'), ru: g('ru'), price: +g('price') || 0, per: g('per'), ask: r.dataset.ask.split(',') } }).filter(s => s.vi);
    n.info = [...$('infoRows').children].map(r => { const o = { t: {}, d: {} }; ['vi', 'en', 'ru'].forEach(l => { o.t[l] = r.querySelector(`[data-it="${l}"]`).value.trim(); o.d[l] = r.querySelector(`[data-id="${l}"]`).value.trim() }); if (r.dataset.copy) o.copy = r.dataset.copy; return o }).filter(i => i.t.vi || i.t.en);
    n.vietqr = { bank: $('vqBank').value.trim(), bin: $('vqBin').value.trim(), account: $('vqAcc').value.trim() };
    // empty English / Russian fields are filled by automatic translation from Vietnamese
    const jobs = [];
    const fill = (o, a, b) => { ['en', 'ru'].forEach(l => { if (!o[b || l] && o[a || 'vi']) jobs.push(fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(o[a || 'vi']) + '&langpair=vi|' + l).then(r => r.json()).then(d => { const x = d && d.responseData && d.responseData.translatedText; if (x) o[b || l] = x }).catch(() => {})) }) };
    n.menu.forEach(m => fill(m)); n.services.forEach(s => fill(s)); n.info.forEach(i => { fill(i.t); fill(i.d) }); fill(n.notice);
    $('saveCfg').disabled = true;
    try { await Promise.all(jobs); await api('/staff/cfg', { cfg: n }); CFG = n; toast(t('saved')); delete S.dataset.built; renderSettings() } catch (er) { toast(er.message) } finally { if ($('saveCfg')) $('saveCfg').disabled = false }
  }
}
function printQr() {
  const base = location.href.replace(/staff\/.*$/, '');
  $('printArea').innerHTML = CFG.rooms.map(rm => { const q = qrcode(0, 'M'); q.addData(base + (HOTEL !== 'demo' ? '?h=' + HOTEL : '') + '#room-' + rm); q.make();
    return `<div style="page-break-after:always;text-align:center;font-family:system-ui;padding:6mm 0"><div style="font-weight:800;font-size:18px">${esc(CFG.name)}</div><div style="width:58mm;margin:4mm auto">${q.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div><div style="font-size:13px">Quét để gọi dịch vụ · Scan for room service · Сервис в номер по QR</div><div style="font-size:26px;font-weight:800;margin-top:3mm">Phòng / Room / Номер ${esc(rm)}</div></div>` }).join('');
  setTimeout(() => window.print(), 50);
}

/* ---------- modal ---------- */
function modal(html, after) { $('mbox').innerHTML = html; $('mbox').onclick = null; $('modal').hidden = false; after && after() }
function closeModal() { $('modal').hidden = true }
$('modal').addEventListener('click', e => { if (e.target === $('modal') || e.target.closest('[data-close]')) closeModal() });

/* ---------- sound and push ---------- */
$('soundBtn').onclick = () => { sound = !sound; store.set('sound', sound ? '1' : '0'); applyLang(); if (sound) beep() };
$('pushBtn').onclick = async () => {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error(t('pushNo'));
    if (await Notification.requestPermission() !== 'granted') throw new Error(t('pushNo'));
    try { const c = await caches.open('hu-config'); await c.put('/hu-config', new Response(JSON.stringify({ api: API, hotel: HOTEL, code }))) } catch (e) {}
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const { key } = await api('/staff/vapid');
    const raw = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - key.length % 4) % 4)), c => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
    await api('/staff/subscribe', { sub: sub.toJSON() }); store.set('push', '1'); applyLang(); toast(t('pushOk'));
  } catch (e) { alert(e.message) }
};

applyLang();
if (code) { poll(true).then(start).catch(() => { $('loginBox').hidden = false }) } else $('loginBox').hidden = false;
})();
</script>
</body>
</html>
