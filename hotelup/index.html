h1:["Dịch vụ QR trong mỗi phòng","A QR service in every room","QR-сервис в каждом номере"],
sub:["Khách quét mã và yêu cầu mọi thứ bằng ngôn ngữ của mình: đồ ăn, dọn phòng, nước, gối, giặt ủi, báo thức, xe đưa đón. Nhân viên nhận yêu cầu bằng tiếng Việt, dịch vụ tính phí tự cộng vào hóa đơn phòng.","Guests scan the code and ask for anything in their own language: food, housekeeping, water, a pillow, laundry, a wake-up call, a transfer. Staff get the request in Vietnamese, and paid services add themselves to the room bill.","Гость сканирует код и просит что угодно на своём языке: еду, уборку, воду и подушку, стирку, будильник, трансфер. Персонал получает запрос на вьетнамском, а платные услуги сами попадают в счёт номера."],

p_h:["Những điều khách không nói, nhưng viết trong đánh giá","What guests don't say, but write in reviews","То, что гости не говорят, но пишут в отзывах"],
p1:["Hoa hồng Booking và Agoda ăn vào lợi nhuận","Booking and Agoda fees eat your margin","Комиссии Booking и Agoda съедают маржу"],p1p:["Còn giá phòng thì bị căn hộ cho thuê ép xuống.","And apartments push your room rate down.","А цену номера давят апартаменты."],
p2:["Dịch vụ thêm bán không chạy","Extra services don't sell","Допуслуги продаются плохо"],p2p:["Khách ngại gọi lễ tân, không biết bạn có giặt ủi hay cho thuê xe máy, nên mua tour ở chỗ khác.","Guests are shy to call the desk, don't know you have laundry or bikes, and buy tours next door.","Гость стесняется звонить на ресепшн, не знает про стирку и байки и берёт тур у соседей."],
p3:["Nhân viên thay đổi, không phải ai cũng biết tiếng Anh","Staff change, not everyone speaks English","Персонал меняется, английский знают не все"],p3p:["Yêu cầu bị hiểu sai hoặc quên chuyển cho buồng phòng và bếp.","Requests get misunderstood or never reach housekeeping and the kitchen.","Запросы понимают неверно или забывают передать горничным и на кухню."],
p4:["Biết hỏng hóc qua đánh giá xấu","You learn about breakdowns from bad reviews","О поломках узнаёте из отзыва"],p4p:["Máy lạnh hỏng, nước yếu — khách im lặng và viết khi đã trả phòng.","Broken AC, weak water — the guest stays quiet and writes after check-out.","Сломался кондиционер, слабая вода — гость молчит и пишет уже после выезда."],
p5:["Tranh cãi khi trả phòng","Arguments at check-out","Споры при выезде"],p5p:["Khách không biết đã dùng bao nhiêu, hoặc cho rằng phí bồi thường là bịa ra.","The guest didn't know what they'd spent, or thinks the damage fee is made up.","Гость не знал, сколько набрал, или считает компенсацию за ущерб придуманной."],
p6:["Lễ tân trả lời mãi một câu hỏi","Reception answers the same questions","Ресепшн отвечает на одни и те же вопросы"],p6p:["Mật khẩu Wi-Fi, nội quy, cách thuê xe máy.","The Wi-Fi password, house rules, how to rent a bike.","Пароль Wi-Fi, правила, как взять байк."],
h_k:["Hotel Up giải quyết thế nào","How Hotel Up helps","Как Hotel Up снимает проблемы"],
h_h:["Mỗi yêu cầu có người nhận và có trạng thái","Every request has an owner and a status","У каждого запроса есть исполнитель и статус"],
h_p:["Khách không cần cài ứng dụng: quét mã QR trong phòng và nhập mã lưu trú một lần.","Guests install nothing: they scan the QR in the room and enter the stay code once.","Гостю ничего не нужно устанавливать: он сканирует QR в номере и один раз вводит код проживания."],
c_was:["Trước đây","Before","Было"],c_now:["Với Hotel Up","With Hotel Up","С Hotel Up"],c_win:["Bạn được gì","What you gain","Ваш выигрыш"],
x1a:["Khách ngại gọi điện và không biết bạn có dịch vụ gì","Guests are shy to call and don't know your services","Гость стесняется звонить и не знает о ваших услугах"],x1b:["Mọi dịch vụ và giá có trên điện thoại khách, đặt chỉ vài lần chạm, không cần nói chuyện","Every service and price is on the guest's phone, ordered in a few taps, no conversation","Все услуги с ценами в телефоне гостя, заказ в пару нажатий, без разговора"],x1c:["Khách thường mua tour, xe máy, giặt ủi và đồ ăn ở bạn hơn","Guests more often buy tours, bikes, laundry and food from you","Тур, байк, стирку и еду гость чаще берёт у вас"],
x2a:["Nhân viên không hiểu khách","Staff don't understand the guest","Персонал не понимает гостя"],x2b:["Khách viết bằng ngôn ngữ của mình, nhân viên đọc bản tự dịch tiếng Việt","The guest writes in their language, staff read an automatic Vietnamese translation","Гость пишет на своём языке, сотрудник читает автоперевод на вьетнамский"],x2c:["Nhân viên không biết tiếng Anh vẫn hiểu yêu cầu","Staff without English still understand the request","Сотрудник без английского понимает запрос"],
x3a:["Yêu cầu bị lạc giữa lễ tân và các bộ phận","Requests get lost between reception and the teams","Запрос теряется между ресепшн и отделами"],x3b:["Yêu cầu đến ngay đúng bộ phận (lễ tân, buồng phòng, bếp) kèm âm thanh và thông báo đẩy. Khách thấy trạng thái","It goes straight to the right team (reception, housekeeping, kitchen) with a sound and a push notification. The guest sees the status","Запрос сразу уходит нужному отделу (ресепшн, горничные, кухня) со звуком и push-уведомлением. Гость видит статус"],x3c:["Không gì bị quên, thấy rõ việc nào xong, việc nào đang làm","Nothing is forgotten; you see what's done and what's in progress","Ничего не забывается, видно, что сделано, а что в работе"],
x4a:["Biết hỏng hóc qua đánh giá","You learn about breakdowns from reviews","О поломке узнаёте из отзыва"],x4b:["Nút «Báo hỏng»: máy lạnh, nước, điện, Wi-Fi, khóa cửa","A “Something broken” button: AC, water, power, Wi-Fi, door lock","Кнопка «Что-то сломалось»: кондиционер, вода, свет, Wi-Fi, замок"],x4c:["Sửa trước khi khách đi, không phải sau đánh giá xấu","Fixed before the guest leaves, not after a bad review","Исправляете до отъезда гостя, а не после плохого отзыва"],
x5a:["Tranh cãi về hóa đơn và bồi thường","Disputes over the bill and damage","Споры о счёте и ущербе"],x5b:["Khách luôn thấy «Hóa đơn của tôi», nội quy và bảng giá bồi thường bằng ngôn ngữ của mình. Khi trả phòng có hóa đơn in với VietQR đúng số tiền","The guest always sees “My bill”, the house rules and the damage price list in their language. At check-out: a printed bill with VietQR for the exact amount","Гость всегда видит «Мой счёт», правила и таблицу компенсаций на своём языке. При выезде — печатный счёт с VietQR на точную сумму"],x5c:["Trả phòng nhanh và êm, thu bồi thường dễ hơn","A quick, calm check-out; damage fees are easier to collect","Быстрый и спокойный выезд, компенсацию взять проще"],
x6a:["Lễ tân nhắc lại mật khẩu Wi-Fi và nội quy","Reception repeats the Wi-Fi password and rules","Ресепшн повторяет пароль Wi-Fi и правила"],x6b:["Mục «Thông tin»: Wi-Fi tầng của khách với nút sao chép mật khẩu, số điện thoại, nội quy","An “Info” section: the guest's floor Wi-Fi with a copy-password button, phone numbers, rules","Раздел «Информация»: Wi-Fi этажа гостя с кнопкой копирования пароля, телефоны, правила"],x6c:["Lễ tân lo cho khách, không phải trả lời câu hỏi lặp lại","Reception looks after guests, not repeat questions","Ресепшн занимается гостями, а не справками"],
m_h:["Doanh thu thêm, không mất hoa hồng Booking","Extra revenue with no Booking fee","Допвыручка без комиссии Booking"],
m_p:["Giá phòng bị đặt bởi cạnh tranh và nền tảng đặt phòng. Còn tiền dịch vụ của khách đang ở chỗ bạn thì thuộc về khách sạn trọn vẹn. Hotel Up làm việc chính ở đây.","Your room rate is set by competition and booking sites. Money from services for a guest already staying with you belongs entirely to the hotel. That's where Hotel Up works.","Цену номера диктуют конкуренты и сайты бронирования. А деньги за услуги гостя, который уже живёт у вас, целиком остаются отелю. Именно здесь работает Hotel Up."],
m1:["Quầy hàng trong mỗi phòng","A shop window in every room","Витрина в каждом номере"],m1p:["Đồ ăn, giặt ủi, xe sân bay, xe máy, tour, cà phê lúc báo thức — có giá, bằng ngôn ngữ của khách.","Food, laundry, airport transfer, bikes, tours, coffee with the wake-up call — with prices, in the guest's language.","Еда, стирка, трансфер в аэропорт, байки, экскурсии, кофе к будильнику — с ценами, на языке гостя."],
m2:["Đặt không ngại ngùng","Ordering without awkwardness","Заказ без неловкости"],m2p:["Không cần gọi điện và giải thích — chính điều đó khiến nhiều khách không đặt.","No call, no explaining — exactly what stops many guests.","Не нужно звонить и объясняться — именно это останавливает многих гостей."],
m3:["Không gì bị quên trong hóa đơn","Nothing lost from the bill","В счёте ничего не теряется"],m3p:["Đồ ăn và dịch vụ «tính vào phòng» tự cộng khi nhân viên bấm «Xong». Giặt ủi tính theo kg.","Food and services “charged to the room” add themselves when staff press “Done”. Laundry is charged by the kg.","Еда и услуги «на счёт номера» добавляются сами, когда персонал нажимает «Готово». Стирка считается по кг."],
m_calc:["Hãy tính cho khách sạn của bạn: mỗi tháng bao nhiêu khách đang thuê xe, đi tour hay giặt ủi ở chỗ bạn — và bao nhiêu người sẽ làm vậy nếu biết ngay khi nhận phòng.","Work it out for your hotel: how many guests a month rent a bike, book a tour or use laundry with you now — and how many would if they knew on arrival.","Посчитайте для своего отеля: сколько гостей в месяц сейчас берут у вас байк, тур или стирку — и сколько могли бы, если бы узнали об этом сразу при заселении."],

pr_in:["Gồm: cài đặt cho khách sạn của bạn, mã QR cho mọi phòng, hướng dẫn nhân viên và tài liệu tiếng Việt.","Includes: setup for your hotel, a QR for every room, staff training and a guide in Vietnamese.","Входит: настройка под ваш отель, QR для всех номеров, обучение персонала и инструкция на вьетнамском."],

sup_in:["Gồm máy chủ xử lý yêu cầu, mã và hóa đơn, cập nhật và hỗ trợ khi có vấn đề.","Includes the server that carries requests, codes and bills, updates, and help when something goes wrong.","Входят сервер, через который идут запросы, коды и счета, обновления и помощь, если что-то не так."],
sup_note:["Hệ thống chạy trên máy chủ này: nếu ngừng hỗ trợ, trang phòng sẽ không nhận yêu cầu nữa.","The system runs on this server: without support, the room page stops accepting requests.","Система работает на этом сервере: без поддержки страница номера перестанет принимать запросы."],
big_h:["Hơn 20 phòng?","More than 20 rooms?","Больше 20 номеров?"],big_p:["Giá khởi chạy và hỗ trợ theo thỏa thuận.","Launch and support priced by agreement.","Запуск и поддержка — по договорённости."],

d1:["Bạn gửi danh sách phòng, dịch vụ và giá, nội quy, Wi-Fi, thông tin VietQR","You send the room list, services and prices, rules, Wi-Fi and VietQR details","Вы даёте список номеров, услуги и цены, правила, Wi-Fi, данные VietQR"],
d2:["Chúng tôi nhập mọi thứ, kết nối máy chủ và làm mã QR cho từng phòng","We enter everything, connect the server and make a QR for every room","Мы всё заносим, подключаем сервер и готовим QR для каждого номера"],
d3:["Hướng dẫn nhân viên và chạy thử: nhận phòng → QR → yêu cầu → hóa đơn → trả phòng","We train staff and run a live test: check-in → QR → request → bill → check-out","Обучаем персонал и проводим живой тест: заселение → QR → запрос → счёт → выезд"],
faq_h:["Câu hỏi thường gặp","Common questions","Частые вопросы"],
q1:["Khách có cần cài ứng dụng không?","Do guests need to install an app?","Гостю нужно устанавливать приложение?"],a1:["Không. Khách quét mã QR trong phòng, trang mở trên trình duyệt điện thoại.","No. The guest scans the QR in the room and the page opens in the phone's browser.","Нет. Гость сканирует QR в номере, страница открывается в браузере телефона."],
q2:["Khách cũ có thể đặt vào hóa đơn của khách mới không?","Can a previous guest order on the new guest's bill?","Может ли прошлый гость заказать на счёт нового?"],a2:["Không. Khi nhận phòng, khách nhận mã lưu trú 4 số và nhập một lần. Mỗi lần nhận phòng có mã mới, khách cũ mất quyền truy cập.","No. At check-in the guest gets a 4-digit stay code and enters it once. Every check-in gets a new code, and the previous guest loses access.","Нет. При заселении гость получает код проживания из 4 цифр и вводит его один раз. При каждом заселении код новый, прошлый гость теряет доступ."],
q3:["Bản dịch có chính xác không?","Is the translation accurate?","Насколько точен перевод?"],a3:["Thực đơn, dịch vụ và nội quy được lưu bằng 3 ngôn ngữ, bạn có thể sửa bản dịch trong cài đặt. Tin nhắn tự do của khách được dịch bằng máy, nên đôi khi chưa chính xác.","Menus, services and rules are stored in three languages, and you can correct any translation in settings. Guests' free-text messages are machine-translated, so they can sometimes be imperfect.","Меню, услуги и правила хранятся на трёх языках, любой перевод можно поправить в настройках. Свободный текст гостя переводится машиной, поэтому иногда неточно."],
q4:["Cần thiết bị gì?","What equipment do we need?","Какое оборудование нужно?"],a4:["Chỉ cần máy tính hoặc điện thoại ở lễ tân. Máy in 80 mm để in hóa đơn là tùy chọn.","Just a computer or phone at reception. An 80 mm printer for bills is optional.","Только компьютер или смартфон на ресепшн. Принтер 80 мм для счетов — по желанию."],
q5:["Có thêm chức năng riêng được không?","Can you add a feature of our own?","Можно добавить свою функцию?"],a5:["Có. Chúng tôi thêm chức năng theo yêu cầu của khách sạn.","Yes. We add features at the hotel's request.","Да. Добавляем функции по запросу отеля."],
q6:["Hóa đơn có phải hóa đơn GTGT không?","Is the bill a VAT invoice?","Счёт — это налоговая накладная?"],a6:["Không. Đây là hóa đơn tạm tính. Hóa đơn GTGT vẫn xuất trong phần mềm kế toán của bạn.","No. It's a provisional bill. VAT invoices still come from your accounting software.","Нет. Это предварительный счёт. Налоговые счета по-прежнему выписываются в вашей бухгалтерской программе."],

const LI={vi:0,en:1,ru:2};
function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(e=>{const v=D[e.dataset.t];if(v)e.textContent=v[LI[l]]});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  document.title=['Hotel Up — dịch vụ QR trong mỗi phòng · Business Up','Hotel Up — a QR service in every room · Business Up','Hotel Up — QR-сервис в каждом номере · Business Up'][LI[l]];
  try{localStorage.setItem('qm_lang',l)}catch(e){}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
(()=>{let l=null;try{l=localStorage.getItem('qm_lang')}catch(e){}
  if(!LI.hasOwnProperty(l)){const n=(navigator.language||'').slice(0,2);l=n==='vi'?'vi':n==='en'?'en':'ru'}
  setLang(l)})();
</script>
<script>
/* "up" motion: blocks rise into view while scrolling (off when the visitor prefers less motion) */
(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.sec-head,.pain,.row,.money,.get,.plan,.days li,.faq details,.final').forEach((el,i)=>{el.classList.add('bu-rv');el.style.transitionDelay=(i%3)*80+'ms';io.observe(el)})})();
</script>
